<script>
const app = document.getElementById('app');

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;',
  }[char]));
}

function safeExternalUrl(value, fallback = '#') {
  try {
    const url = new URL(String(value || ''), window.location.href);
    return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : fallback;
  } catch (_) {
    return fallback;
  }
}

function getSpotifyOembedUrl(item) {
  const id = item.spotifyTrackId;
  if (!id || !/^[A-Za-z0-9]{22}$/.test(id)) return null;
  return `https://open.spotify.com/oembed?url=https://open.spotify.com/track/${id}`;
}

async function resolveCoverFromSpotify(item) {
  const oembedUrl = getSpotifyOembedUrl(item);
  if (!oembedUrl) return '';
  try {
    const response = await fetch(oembedUrl);
    if (!response.ok) return '';
    const json = await response.json();
    return safeExternalUrl(json.thumbnail_url, '');
  } catch (_) {
    return '';
  }
}

function normalizeYouTubeId(value) {
  const id = String(value || '').trim();
  return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : '';
}

function getReleaseSlug(item) {
  return `${item?.title || ''}-${item?.artist || ''}`
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'release';
}

function getReleaseShortCode(item) {
  const input = getReleaseSlug(item);
  let hash = 5381;
  for (let i = 0; i < input.length; i++) {
    hash = ((hash << 5) + hash) ^ input.charCodeAt(i);
  }
  return (hash >>> 0).toString(36).padStart(6, '0').slice(0, 6);
}

function getSmartlinkPath(item) {
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const isNestedLinkPage = pathParts.length >= 2 && pathParts[pathParts.length - 2] === 'link';
  return `${isNestedLinkPage ? '../' : ''}${encodeURIComponent(getReleaseShortCode(item))}/`;
}

function makeInitials(title) {
  return String(title || '').split(' ').slice(0, 2).map(word => word[0] || '').join('').toUpperCase() || 'HL';
}

function formatReleaseDate(value) {
  if (!value) return '';
  const date = new Date(`${value}T00:00:00`);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getYouTubeArtworkUrl(item, platformMetadata) {
  const platformMeta = platformMetadata[item.title] || {};
  const youtubeId = normalizeYouTubeId(platformMeta.youtubeId || item.youtubeId || platformMeta.youtubeMusicId || item.youtubeMusicId);
  return youtubeId ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg` : '';
}

function buildPlatformUrls(item, platformMetadata) {
  const platformMeta = platformMetadata[item.title] || {};
  const searchArtist = item.artist || 'Hasbi LH';
  const searchQuery = encodeURIComponent(`${item.title} ${searchArtist}`);
  const spotifyTrackId = item.spotifyTrackId;
  const isSpotifyTrack = spotifyTrackId && /^[A-Za-z0-9]{22}$/.test(spotifyTrackId);
  const spotifyUrl = isSpotifyTrack
    ? `https://open.spotify.com/track/${spotifyTrackId}`
    : `https://open.spotify.com/search/${searchQuery}`;

  const appleMusicUrl = platformMeta.appleUrl
    || (platformMeta.appleTrackId && platformMeta.appleAlbumId
      ? `https://music.apple.com/id/album/${platformMeta.appleAlbumId}?i=${platformMeta.appleTrackId}`
      : item.appleTrackId && item.appleAlbumId
        ? `https://music.apple.com/id/album/${item.appleAlbumId}?i=${item.appleTrackId}`
        : item.appleId
          ? `https://music.apple.com/id/album/${item.appleId}`
          : `https://music.apple.com/id/search?term=${searchQuery}`);

  const youtubeId = platformMeta.youtubeId || item.youtubeId;
  const youtubeUrl = normalizeYouTubeId(youtubeId)
    ? `https://www.youtube.com/watch?v=${youtubeId}`
    : `https://www.youtube.com/results?search_query=${searchQuery}`;
  const youtubeMusicId = platformMeta.youtubeMusicId || item.youtubeMusicId || youtubeId;
  const youtubeMusicUrl = platformMeta.youtubeMusicUrl || item.youtubeMusicUrl
    || (normalizeYouTubeId(youtubeMusicId)
      ? `https://music.youtube.com/watch?v=${youtubeMusicId}`
      : `https://music.youtube.com/search?q=${searchQuery}`);
  const deezerTrack = platformMeta.deezerTrackId || item.deezerTrackId;
  const deezerUrl = platformMeta.deezerUrl || item.deezerUrl
    || (/^\d+$/.test(String(deezerTrack || ''))
      ? `https://www.deezer.com/en/track/${deezerTrack}`
      : `https://www.deezer.com/search/${searchQuery}`);
  const tidalTrack = platformMeta.tidalTrackId || item.tidalTrackId;
  const tidalAlbum = platformMeta.tidalAlbumId || item.tidalAlbumId;
  const tidalUrl = platformMeta.tidalUrl || item.tidalUrl
    || (/^\d+$/.test(String(tidalTrack || ''))
      ? `https://tidal.com/browse/track/${tidalTrack}`
      : tidalAlbum
        ? `https://tidal.com/browse/album/${tidalAlbum}`
        : `https://tidal.com/search/${searchQuery}`);

  return [
    ['Spotify', safeExternalUrl(spotifyUrl), spotifyIcon()],
    ['Apple Music', safeExternalUrl(appleMusicUrl), appleIcon()],
    ['YouTube', safeExternalUrl(youtubeUrl), youtubeIcon()],
    ['YT Music', safeExternalUrl(youtubeMusicUrl), ytMusicIcon()],
    ['Deezer', safeExternalUrl(deezerUrl), deezerIcon()],
    ['Tidal', safeExternalUrl(tidalUrl), tidalIcon()],
    ['Amazon Music', safeExternalUrl(platformMeta.amazonUrl || item.amazonUrl || `https://music.amazon.com/search/${searchQuery}`), amazonIcon()],
    ['SoundCloud', safeExternalUrl(platformMeta.soundcloudUrl || item.soundcloudUrl || `https://soundcloud.com/search?q=${searchQuery}`), soundcloudIcon()],
  ];
}

async function loadDatabase() {
  const fallback = {
    discography: typeof DISCOGRAPHY !== 'undefined' ? DISCOGRAPHY : [],
    platformMetadata: typeof PLATFORM_METADATA !== 'undefined' ? PLATFORM_METADATA : {},
  };
  try {
    const response = await fetch('../../data/discography.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('JSON unavailable');
    const data = await response.json();
    return {
      discography: Array.isArray(data.discography) ? data.discography : fallback.discography,
      platformMetadata: data.platformMetadata || fallback.platformMetadata,
    };
  } catch (_) {
    return fallback;
  }
}

function findRelease(items) {
  const params = new URLSearchParams(window.location.search);
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const pathId = pathParts[pathParts.length - 1] === 'link' ? '' : pathParts[pathParts.length - 1];
  const id = params.get('id') || '';
  const track = params.get('track') || '';
  const normalizedId = (id || pathId || '').toLowerCase();
  const normalizedTrack = track.toLowerCase();
  if (normalizedId) {
    return items.find(item => getReleaseShortCode(item) === normalizedId)
      || items.find(item => String(item.spotifyTrackId || '').toLowerCase() === normalizedId);
  }
  if (!normalizedTrack) return null;
  return items.find(item => getReleaseSlug(item) === normalizedTrack)
    || items.find(item => String(item.title || '').toLowerCase() === normalizedTrack);
}

async function renderRelease(item, platformMetadata) {
  document.title = `${item.title} by ${item.artist || 'Hasbi LH'}`;
  const coverUrl = await resolveCoverFromSpotify(item)
    || safeExternalUrl(item.cover, '')
    || getYouTubeArtworkUrl(item, platformMetadata);
  const cover = coverUrl
    ? `<img class="cover" src="${escapeHtml(coverUrl)}" alt="${escapeHtml(item.title)}">`
    : `<div class="cover"><div class="placeholder">${escapeHtml(makeInitials(item.title))}</div></div>`;
  const links = buildPlatformUrls(item, platformMetadata);
  const currentUrl = window.location.href;

  app.innerHTML = `
    <div class="hero">
      ${cover}
      <div>
        <h1>${escapeHtml(item.title)}</h1>
        <p class="artist">${escapeHtml(item.artist || 'Hasbi LH')}</p>
        <div class="meta">
          ${item.releaseDate ? `<span class="pill">${escapeHtml(formatReleaseDate(item.releaseDate))}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="links">
      ${links.map(([name, url, icon]) => `
        <a class="platform" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">
          <span>${icon}${escapeHtml(name)}</span>
          <small>OPEN</small>
        </a>
      `).join('')}
    </div>
    <div class="tools">
      <button class="tool-button" type="button" id="shareLink">Share</button>
    </div>
  `;

  document.getElementById('shareLink')?.addEventListener('click', async event => {
    try {
      if (navigator.share) {
        await navigator.share({
          title: `${item.title} - ${item.artist || 'Hasbi LH'}`,
          text: `Dengarkan ${item.title}`,
          url: currentUrl,
        });
        return;
      }
      await navigator.clipboard.writeText(currentUrl);
      event.currentTarget.textContent = 'Link copied';
    } catch (_) {
      event.currentTarget.textContent = 'Share failed';
    }
  });
}

function renderSearch(items) {
  app.innerHTML = `
    <div class="search">
      <h1>Pilih Rilisan</h1>
      <input id="releaseSearch" placeholder="Cari judul atau artist..." autocomplete="off">
      <div class="results" id="results"></div>
    </div>
  `;
  const input = document.getElementById('releaseSearch');
  const results = document.getElementById('results');
  const renderResults = () => {
    const query = input.value.trim().toLowerCase();
    const visible = (query
      ? items.filter(item => [item.title, item.artist, item.year, item.type].join(' ').toLowerCase().includes(query))
      : items
    ).slice(0, 24);
    results.innerHTML = visible.map(item => `
      <a class="result" href="${escapeHtml(getSmartlinkPath(item))}">
        <span>${escapeHtml(item.title)}<br><small>${escapeHtml(item.artist || 'Hasbi LH')}</small></span>
        <small>${escapeHtml(item.year || '')}</small>
      </a>
    `).join('');
  };
  input.addEventListener('input', renderResults);
  renderResults();
  input.focus();
}

(async function init() {
  const database = await loadDatabase();
  const items = database.discography || [];
  const release = findRelease(items);
  if (release) {
    await renderRelease(release, database.platformMetadata || {});
  } else {
    renderSearch(items);
  }
})();
</script>
</body>
</html>
