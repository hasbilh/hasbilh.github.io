<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discography Admin | Hasbi LH</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  :root {
    --bg: #0a0f1e;
    --panel: #111c35;
    --panel2: #162040;
    --text: #f0f4ff;
    --muted: #8899bb;
    --border: rgba(59,130,246,0.24);
    --accent: #3b82f6;
    --danger: #ef4444;
    --ok: #22c55e;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  main {
    width: min(1040px, calc(100% - 32px));
    margin: 0 auto;
    padding: 32px 0 48px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  h1, h2 { margin: 0; line-height: 1.1; }
  h1 { font-size: clamp(28px, 4vw, 44px); }
  h2 { font-size: 18px; margin-bottom: 16px; }
  p { color: var(--muted); line-height: 1.6; }
  a { color: var(--accent); }
  .panel {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  label {
    display: grid;
    gap: 7px;
    color: var(--muted);
    font-size: 13px;
  }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0d1528;
    color: var(--text);
    padding: 11px 12px;
    font: inherit;
  }
  textarea { min-height: 92px; resize: vertical; }
  button {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--accent);
    color: white;
    padding: 11px 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button.secondary { background: var(--panel2); }
  button.danger { background: var(--danger); border-color: rgba(239,68,68,0.55); }
  button.small {
    padding: 7px 9px;
    font-size: 12px;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 6px;
    background: #0d1528;
    color: var(--muted);
    white-space: pre-wrap;
  }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--danger); }
  .span-2 { grid-column: span 2; }
  .preview {
    overflow: auto;
    max-height: 560px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-align: left;
    vertical-align: top;
  }
  th { color: var(--muted); background: #0d1528; position: sticky; top: 0; }
  .table-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 14px 0;
  }
  .toolbar input { max-width: 380px; }
  .date-field {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
  }
  .date-field button {
    padding-inline: 12px;
    white-space: nowrap;
  }
  .editing-badge {
    display: none;
    color: var(--ok);
    font-weight: 700;
  }
  .editing-badge.active { display: inline; }
  .note { font-size: 13px; margin: 8px 0 0; }
  @media (max-width: 760px) {
    header { align-items: flex-start; flex-direction: column; }
    .grid { grid-template-columns: 1fr; }
    .span-2 { grid-column: auto; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Discography Admin</h1>
      <p>Anjay.</p>
    </div>
    <a href="../">Buka situs</a>
  </header>

  <section class="panel">
    <h2>Login Admin</h2>
    <p class="note">Login memakai GitHub OAuth.</p>
    <div class="actions">
      <button id="loginBtn" type="button">Login with GitHub</button>
      <button id="loadBtn" class="secondary" type="button" hidden>Load Database</button>
      <button id="logoutBtn" class="secondary" type="button" hidden>Logout</button>
    </div>
    <div id="connectionStatus" class="status">Belum login.</div>
  </section>

  <section class="panel admin-only" hidden>
    <h2>Input / Edit Rilisan</h2>
    <form id="releaseForm">
      <div class="grid">
        <label>Judul
          <input id="title" required placeholder="Contoh: Greesel Lutuna">
        </label>
        <label>Artists
          <input id="artist" required placeholder="Hasbi LH">
        </label>
        <label>Kategori
          <select id="type">
            <option selected>Solo</option>
            <option>Kolaborasi</option>
            <option>Grup Musik Hasbi LH</option>
            <option>Artis Lain</option>
          </select>
        </label>
        <label>Tanggal rilis
          <span class="date-field">
            <input id="releaseDate" type="date" required>
            <button id="releaseDateBtn" class="secondary" type="button">Date</button>
          </span>
        </label>
        <label>Album
          <input id="album" placeholder="Nama album / single">
        </label>
        <label>Author / Songwriters
          <input id="songwriters" placeholder="Hasbi LH">
        </label>
        <label>Composer
          <input id="composer" placeholder="Hasbi LH">
        </label>
        <label>Producer
          <input id="producer" placeholder="Hasbi LH">
        </label>
        <label>Mixing
          <input id="mixing" placeholder="Hasbi LH">
        </label>
        <label>Mastering
          <input id="mastering" placeholder="Hasbi LH">
        </label>
        <label>Studio / Label
          <input id="studioLabel" placeholder="Nama studio atau label">
        </label>
        <label>Cover URL
          <input id="cover" placeholder="https://...jpg/png">
        </label>
        <label>Spotify Track ID atau URL
          <input id="spotifyTrack" placeholder="https://open.spotify.com/track/...">
        </label>
        <label>Spotify Album/Release ID atau URL
          <input id="spotifyAlbum" placeholder="https://open.spotify.com/album/...">
        </label>
        <label>Apple Music URL atau ID
          <input id="appleUrl" placeholder="https://music.apple.com/... atau 1818993667">
        </label>
        <label>Apple Album URL atau ID
          <input id="appleAlbum" placeholder="https://music.apple.com/id/album/... atau 1818993667">
        </label>
        <label>YouTube ID atau URL
          <input id="youtubeId" placeholder="https://www.youtube.com/watch?v=...">
        </label>
        <label>YouTube Music ID atau URL
          <input id="youtubeMusicId" placeholder="https://music.youtube.com/watch?v=...">
        </label>
        <label>Deezer Track ID atau URL
          <input id="deezerTrackId" placeholder="https://www.deezer.com/track/...">
        </label>
        <label>Tidal Track ID atau URL
          <input id="tidalUrl" placeholder="https://tidal.com/...">
        </label>
      </div>
      <div class="actions">
        <button id="saveBtn" type="submit">Tambah & Commit</button>
        <button id="resetBtn" class="secondary" type="reset">Reset Form</button>
        <button id="cancelEditBtn" class="secondary" type="button" hidden>Batal Edit</button>
        <span id="editingBadge" class="editing-badge">Mode edit aktif</span>
      </div>
    </form>
    <div id="saveStatus" class="status">Isi form lalu commit ke database.</div>
  </section>

  <section class="panel admin-only" hidden>
    <h2>Semua Diskografi</h2>
    <div id="summary" class="status">Database belum dimuat.</div>
    <div class="toolbar">
      <input id="tableSearch" placeholder="Cari judul, artist, kategori, tahun...">
      <button id="refreshTableBtn" class="secondary" type="button">Refresh</button>
    </div>
    <div class="preview">
      <table>
        <thead>
          <tr><th>Judul</th><th>Artists</th><th>Kategori</th><th>Rilis</th><th>Aksi</th></tr>
        </thead>
        <tbody id="discographyRows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const API_BASE = 'https://hasbi-discography-api.21stvengenz.workers.dev';

const els = {
  loginBtn: document.getElementById('loginBtn'),
  loadBtn: document.getElementById('loadBtn'),
  logoutBtn: document.getElementById('logoutBtn'),
  connectionStatus: document.getElementById('connectionStatus'),
  form: document.getElementById('releaseForm'),
  saveStatus: document.getElementById('saveStatus'),
  summary: document.getElementById('summary'),
  discographyRows: document.getElementById('discographyRows'),
  tableSearch: document.getElementById('tableSearch'),
  refreshTableBtn: document.getElementById('refreshTableBtn'),
  cancelEditBtn: document.getElementById('cancelEditBtn'),
  releaseDateBtn: document.getElementById('releaseDateBtn'),
  editingBadge: document.getElementById('editingBadge'),
};

let database = null;
let editingIndex = null;
let editingOriginalTitle = null;
let sessionToken = sessionStorage.getItem('discography_admin_session') || '';

const callbackSession = new URLSearchParams(window.location.search).get('session');
if (callbackSession) {
  sessionToken = callbackSession;
  sessionStorage.setItem('discography_admin_session', sessionToken);
  window.history.replaceState({}, document.title, window.location.pathname);
}

function setStatus(el, message, kind) {
  el.textContent = message;
  el.className = 'status' + (kind ? ` ${kind}` : '');
}

function setAdminPanelsVisible(visible) {
  document.querySelectorAll('.admin-only').forEach(panel => {
    panel.hidden = !visible;
  });
}

function setLoginControls(loggedIn) {
  els.loginBtn.hidden = loggedIn;
  els.loadBtn.hidden = !loggedIn;
  els.logoutBtn.hidden = !loggedIn;
}

function ensureConfigured() {
  if (API_BASE.includes('NAMA-AKUN')) {
    throw new Error('API_BASE belum diisi. Edit admin/index.html dan ganti URL Worker terlebih dahulu.');
  }
}

function authHeaders(extra = {}) {
  if (!sessionToken) throw new Error('Login GitHub diperlukan.');
  return {
    Authorization: `Bearer ${sessionToken}`,
    ...extra,
  };
}

async function apiRequest(path, options = {}) {
  ensureConfigured();
  const response = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      ...(options.headers || {}),
    },
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(body.error || `API error ${response.status}`);
  }
  return body;
}

async function loadDatabase() {
  database = await apiRequest('/discography', {
    method: 'GET',
    headers: authHeaders(),
  });
  if (!Array.isArray(database.discography)) database.discography = [];
  if (!database.platformMetadata || typeof database.platformMetadata !== 'object') database.platformMetadata = {};
  setAdminPanelsVisible(true);
  renderSummary();
  return database;
}

function renderSummary() {
  const items = (database?.discography || [])
    .map((item, index) => ({ item, index }))
    .sort((a, b) => (b.item.releaseDate || '').localeCompare(a.item.releaseDate || ''));
  const query = els.tableSearch.value.trim().toLowerCase();
  const visibleItems = query
    ? items.filter(({ item }) => [item.title, item.artist, item.type, item.year, item.releaseDate].join(' ').toLowerCase().includes(query))
    : items;

  setStatus(els.summary, `${items.length} rilisan dimuat dari data/discography.json.`, 'ok');
  els.discographyRows.innerHTML = visibleItems.map(({ item, index }) => `
    <tr>
      <td>${escapeHtml(item.title || '')}</td>
      <td>${escapeHtml(item.artist || '')}</td>
      <td>${escapeHtml(item.type || '')}</td>
      <td>${escapeHtml(item.releaseDate || '')}</td>
      <td>
        <div class="table-actions">
          <button class="small secondary" type="button" data-action="edit" data-index="${index}">Edit</button>
          <button class="small danger" type="button" data-action="delete" data-index="${index}">Hapus</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;',
  }[char]));
}

function extractSpotifyId(value, expectedType) {
  const text = value.trim();
  if (!text) return null;
  const match = text.match(new RegExp(`/intl-[a-z]+/${expectedType}/([A-Za-z0-9]+)|/${expectedType}/([A-Za-z0-9]+)`));
  return match ? (match[1] || match[2]) : text;
}

function isUrl(value) {
  return /^https?:\/\//i.test(value.trim());
}

function extractYouTubeId(value) {
  const text = value.trim();
  if (!text) return null;
  if (!isUrl(text)) return text;
  try {
    const url = new URL(text);
    if (url.searchParams.get('v')) return url.searchParams.get('v');
    const parts = url.pathname.split('/').filter(Boolean);
    return parts.pop() || text;
  } catch (_) {
    return text;
  }
}

function extractDeezerTrackId(value) {
  const text = value.trim();
  if (!text) return null;
  const match = text.match(/\/track\/(\d+)/i);
  return match ? match[1] : text;
}

function extractTidalTrackId(value) {
  const text = value.trim();
  if (!text) return null;
  const match = text.match(/\/track\/(\d+)/i);
  return match ? match[1] : text;
}

function parseAppleMusicValue(value) {
  const text = value.trim();
  if (!text) return null;
  const result = {};

  const albumMatch = text.match(/\/album\/[^/]+\/(\d+)/i);
  const idMatch = text.match(/\/album\/(\d+)/i);
  const trackMatch = text.match(/[?&]i=(\d+)/i);

  if (/^https?:\/\//i.test(text)) {
    result.appleUrl = text;
    if (albumMatch) result.appleAlbumId = albumMatch[1];
    else if (idMatch) result.appleAlbumId = idMatch[1];
    if (trackMatch) result.appleTrackId = trackMatch[1];
    return result;
  }

  result.appleAlbumId = text;
  return result;
}

function cleanValue(value) {
  const text = value.trim();
  return text || null;
}

function setInputValue(id, value) {
  document.getElementById(id).value = value || '';
}

function clearEditMode() {
  editingIndex = null;
  editingOriginalTitle = null;
  document.getElementById('saveBtn').textContent = 'Tambah & Commit';
  els.cancelEditBtn.hidden = true;
  els.editingBadge.classList.remove('active');
}

function fillFormForEdit(index) {
  if (!database || !database.discography[index]) return;
  const item = database.discography[index];
  const platformMeta = database.platformMetadata[item.title] || {};

  editingIndex = index;
  editingOriginalTitle = item.title;
  setInputValue('title', item.title);
  setInputValue('artist', item.artist);
  document.getElementById('type').value = item.type || 'Kolaborasi';
  setInputValue('releaseDate', item.releaseDate);
  setInputValue('spotifyTrack', item.spotifyTrackId);
  setInputValue('spotifyAlbum', item.spotifyId);
  setInputValue('appleUrl', platformMeta.appleUrl || item.appleUrl || platformMeta.appleAlbumId || item.appleAlbumId || item.appleId);
  setInputValue('appleAlbum', platformMeta.appleAlbumUrl || platformMeta.appleAlbumId || item.appleAlbumId || item.appleId);
  setInputValue('tidalUrl', platformMeta.tidalUrl || item.tidalUrl || platformMeta.tidalTrackId || item.tidalTrackId);
  setInputValue('youtubeId', item.youtubeId || platformMeta.youtubeId);
  setInputValue('youtubeMusicId', item.youtubeMusicId || platformMeta.youtubeMusicId);
  setInputValue('deezerTrackId', platformMeta.deezerUrl || item.deezerUrl || item.deezerTrackId || platformMeta.deezerTrackId);
  setInputValue('cover', item.cover);
  setInputValue('album', item.album);
  setInputValue('songwriters', item.songwriters);
  setInputValue('composer', item.composer);
  setInputValue('producer', item.producer);
  setInputValue('mixing', item.mixing);
  setInputValue('mastering', item.mastering);
  setInputValue('studioLabel', item.studioLabel);

  document.getElementById('saveBtn').textContent = 'Simpan Edit & Commit';
  els.cancelEditBtn.hidden = false;
  els.editingBadge.classList.add('active');
  setStatus(els.saveStatus, `Mengedit "${item.title}".`);
  window.scrollTo({ top: document.getElementById('releaseForm').offsetTop - 24, behavior: 'smooth' });
}

function buildReleaseFromForm() {
  const releaseDate = document.getElementById('releaseDate').value;
  const title = document.getElementById('title').value.trim();
  const spotifyTrackId = extractSpotifyId(document.getElementById('spotifyTrack').value, 'track');
  const spotifyId = extractSpotifyId(document.getElementById('spotifyAlbum').value, 'album');

  if (!title) throw new Error('Judul wajib diisi.');
  if (!releaseDate) throw new Error('Tanggal rilis wajib diisi.');

  const item = {
    title,
    year: Number(releaseDate.slice(0, 4)),
    releaseDate,
    type: document.getElementById('type').value,
    spotifyId,
    spotifyTrackId,
    cover: cleanValue(document.getElementById('cover').value),
    artist: document.getElementById('artist').value.trim(),
  };

  const album = cleanValue(document.getElementById('album').value);
  if (album) item.album = album;

  const songwriters = cleanValue(document.getElementById('songwriters').value);
  if (songwriters) item.songwriters = songwriters;

  const composer = cleanValue(document.getElementById('composer').value);
  if (composer) item.composer = composer;

  const producer = cleanValue(document.getElementById('producer').value);
  if (producer) item.producer = producer;

  const mixing = cleanValue(document.getElementById('mixing').value);
  if (mixing) item.mixing = mixing;

  const mastering = cleanValue(document.getElementById('mastering').value);
  if (mastering) item.mastering = mastering;

  const studioLabel = cleanValue(document.getElementById('studioLabel').value);
  if (studioLabel) item.studioLabel = studioLabel;

  const platformMeta = {};
  const youtubeValue = cleanValue(document.getElementById('youtubeId').value);
  const youtubeMusicValue = cleanValue(document.getElementById('youtubeMusicId').value);
  const appleUrl = cleanValue(document.getElementById('appleUrl').value);
  const appleAlbumValue = cleanValue(document.getElementById('appleAlbum').value);
  const deezerValue = cleanValue(document.getElementById('deezerTrackId').value);
  const tidalValue = cleanValue(document.getElementById('tidalUrl').value);

  if (youtubeValue) platformMeta.youtubeId = extractYouTubeId(youtubeValue);
  if (youtubeMusicValue) platformMeta.youtubeMusicId = extractYouTubeId(youtubeMusicValue);
  if (appleUrl) {
    const appleMeta = parseAppleMusicValue(appleUrl);
    if (appleMeta.appleUrl) platformMeta.appleUrl = appleMeta.appleUrl;
    if (appleMeta.appleTrackId) platformMeta.appleTrackId = appleMeta.appleTrackId;
    if (appleMeta.appleAlbumId) platformMeta.appleAlbumId = appleMeta.appleAlbumId;
  }
  if (appleAlbumValue) {
    const appleAlbumMeta = parseAppleMusicValue(appleAlbumValue);
    if (appleAlbumMeta.appleUrl) platformMeta.appleAlbumUrl = appleAlbumMeta.appleUrl;
    if (appleAlbumMeta.appleAlbumId) platformMeta.appleAlbumId = appleAlbumMeta.appleAlbumId;
  }
  if (deezerValue) {
    if (isUrl(deezerValue)) platformMeta.deezerUrl = deezerValue;
    platformMeta.deezerTrackId = extractDeezerTrackId(deezerValue);
  }
  if (tidalValue) {
    if (isUrl(tidalValue)) platformMeta.tidalUrl = tidalValue;
    else platformMeta.tidalTrackId = extractTidalTrackId(tidalValue);
  }

  return { item, platformMeta };
}

async function saveDatabase(message) {
  if (!database) throw new Error('Database belum dimuat.');
  await apiRequest('/discography', {
    method: 'PUT',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({
      ...database,
      commitMessage: message,
    }),
  });
}

async function checkSession() {
  if (!sessionToken) {
    setAdminPanelsVisible(false);
    setLoginControls(false);
    setStatus(els.connectionStatus, 'Belum login.');
    return;
  }
  try {
    const me = await apiRequest('/me', {
      method: 'GET',
      headers: authHeaders(),
    });
    const expiry = me.expiresAt ? new Date(me.expiresAt * 1000).toLocaleString('id-ID') : 'tidak diketahui';
    setAdminPanelsVisible(true);
    setLoginControls(true);
    setStatus(els.connectionStatus, `Login sebagai ${me.login}. Session berlaku sampai ${expiry}.`, 'ok');
  } catch (error) {
    sessionToken = '';
    sessionStorage.removeItem('discography_admin_session');
    setAdminPanelsVisible(false);
    setLoginControls(false);
    setStatus(els.connectionStatus, error.message, 'error');
  }
}

els.loginBtn.addEventListener('click', () => {
  try {
    ensureConfigured();
    window.location.href = `${API_BASE}/auth/github/start`;
  } catch (error) {
    setStatus(els.connectionStatus, error.message, 'error');
  }
});

els.loadBtn.addEventListener('click', async () => {
  els.loadBtn.disabled = true;
  setStatus(els.connectionStatus, 'Memuat database...');
  try {
    await loadDatabase();
    setStatus(els.connectionStatus, 'Database berhasil dimuat.', 'ok');
  } catch (error) {
    setStatus(els.connectionStatus, error.message, 'error');
  } finally {
    els.loadBtn.disabled = false;
  }
});

els.logoutBtn.addEventListener('click', () => {
  sessionToken = '';
  database = null;
  sessionStorage.removeItem('discography_admin_session');
  els.discographyRows.innerHTML = '';
  setAdminPanelsVisible(false);
  setLoginControls(false);
  setStatus(els.connectionStatus, 'Logout berhasil.');
  setStatus(els.summary, 'Database belum dimuat.');
});

els.releaseDateBtn.addEventListener('click', () => {
  const input = document.getElementById('releaseDate');
  if (typeof input.showPicker === 'function') {
    input.showPicker();
  } else {
    input.focus();
  }
});

els.tableSearch.addEventListener('input', () => {
  if (database) renderSummary();
});

els.refreshTableBtn.addEventListener('click', async () => {
  els.refreshTableBtn.disabled = true;
  setStatus(els.summary, 'Memuat ulang database...');
  try {
    await loadDatabase();
  } catch (error) {
    setStatus(els.summary, error.message, 'error');
  } finally {
    els.refreshTableBtn.disabled = false;
  }
});

els.discographyRows.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const index = Number(button.dataset.index);
  const item = database?.discography[index];
  if (!item) return;

  if (button.dataset.action === 'edit') {
    fillFormForEdit(index);
    return;
  }

  if (button.dataset.action === 'delete') {
    const ok = confirm(`Hapus "${item.title}" dari database dan commit perubahan?`);
    if (!ok) return;

    button.disabled = true;
    try {
      const removed = database.discography.splice(index, 1)[0];
      if (removed?.title && database.platformMetadata[removed.title]) {
        delete database.platformMetadata[removed.title];
      }
      await saveDatabase(`Remove discography release: ${removed.title}`);
      if (editingIndex === index) {
        els.form.reset();
        clearEditMode();
      }
      renderSummary();
      setStatus(els.saveStatus, `Rilisan "${removed.title}" berhasil dihapus dan dicommit.`, 'ok');
    } catch (error) {
      setStatus(els.saveStatus, error.message, 'error');
      await loadDatabase().catch(() => {});
    }
  }
});

els.cancelEditBtn.addEventListener('click', () => {
  els.form.reset();
  document.getElementById('type').value = 'Kolaborasi';
  clearEditMode();
  setStatus(els.saveStatus, 'Mode edit dibatalkan.');
});

els.form.addEventListener('reset', () => {
  setTimeout(() => {
    document.getElementById('type').value = 'Kolaborasi';
    clearEditMode();
  }, 0);
});

els.form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  setStatus(els.saveStatus, 'Menyiapkan data...');
  try {
    if (!database) await loadDatabase();
    const { item, platformMeta } = buildReleaseFromForm();
    const duplicate = database.discography.find((existing, index) => index !== editingIndex && existing.title === item.title && existing.artist === item.artist);
    if (duplicate && !confirm('Judul dan artist yang sama sudah ada. Tetap tambahkan?')) return;

    if (editingIndex === null) {
      database.discography.unshift(item);
    } else {
      database.discography[editingIndex] = item;
      if (editingOriginalTitle && editingOriginalTitle !== item.title && database.platformMetadata[editingOriginalTitle]) {
        delete database.platformMetadata[editingOriginalTitle];
      }
    }

    if (Object.keys(platformMeta).length > 0) {
      database.platformMetadata[item.title] = {
        ...(database.platformMetadata[item.title] || {}),
        ...platformMeta,
      };
    } else if (editingIndex !== null && database.platformMetadata[item.title]) {
      delete database.platformMetadata[item.title];
    }

    const action = editingIndex === null ? 'Add' : 'Update';
    await saveDatabase(`${action} discography release: ${item.title}`);
    setStatus(els.saveStatus, `Rilisan "${item.title}" berhasil ${editingIndex === null ? 'ditambahkan' : 'diperbarui'} dan dicommit.`, 'ok');
    await loadDatabase();
    els.form.reset();
    document.getElementById('type').value = 'Kolaborasi';
    clearEditMode();
  } catch (error) {
    setStatus(els.saveStatus, error.message, 'error');
  } finally {
    saveBtn.disabled = false;
  }
});

checkSession();
</script>
</body>
</html>
